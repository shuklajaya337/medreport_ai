services:
  - type: web
    name: medreport-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://medreport-ai-gamma.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.0
